# Deploys two builds of the viewer to a single GitHub Pages site:
#   main -> https://savages-corp.github.io/data-layer-viewer/       (production)
#   dev  -> https://savages-corp.github.io/data-layer-viewer/dev/   (test)
#
# GitHub Pages only serves one site per repository, so both branches are
# always built together and uploaded as one artifact, no matter which branch
# triggered the run.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the production or the test branch
  push:
    branches: [main, dev]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dev (test)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            dev/package-lock.json

      - name: Build main -> /
        working-directory: main
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Build dev -> /dev/
        working-directory: dev
        run: |
          npm ci --ignore-scripts
          npm run build -- --base=/data-layer-viewer/dev/

      - name: Assemble site
        run: |
          mkdir -p site/dev
          cp -r main/dist/. site/
          cp -r dev/dist/. site/dev/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
